name: Selenium Java CI
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest # Linux es el entorno estándar
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17' # Cambia según tu proyecto
          distribution: 'temurin'
          cache: maven

      - name: Ejecutar pruebas con Maven
        run: mvn clean test # Ejecuta el comando estándar de Maven

      - name: Upload ChromeDriver log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: chromedriver-log
          path: chromedriver.log

 
